<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor Desain dengan Kode</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e2e8ee;--pn:#fff;--ink:#17202a;--mu:#5b6a79;--ac:#0b7d6e;--on:#fff;--ln:#cdd6de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141a;--pn:#18212a;--ink:#e8eef3;--mu:#93a2b1;--ac:#3cc4b0;--on:#06201c;--ln:#2a3641;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141a;--pn:#18212a;--ink:#e8eef3;--mu:#93a2b1;--ac:#3cc4b0;--on:#06201c;--ln:#2a3641;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.35 'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
h1{font-size:16px;margin:0;flex:1;font-weight:700}
button{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button.pri,button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
#fit{position:relative;box-shadow:0 2px 14px #0004}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none;user-select:none}
.sel{outline:calc(2px / var(--k)) solid var(--ac)}
.hr,.hs{position:absolute;display:block;width:var(--hs);height:var(--hs);border-radius:50%;background:#fff;border:calc(2px / var(--k)) solid var(--ac);touch-action:none}
.hs{right:calc(var(--hs) / -2);bottom:calc(var(--hs) / -2)}
.hr{left:50%;margin-left:calc(var(--hs) / -2);top:calc(var(--hs) * -1.5)}
#tools{display:flex;gap:6px;padding:6px 10px;overflow-x:auto;background:var(--pn);border-top:1px solid var(--ln)}
#sheet{background:var(--pn);border-top:1px solid var(--ln);height:34vh;min-height:170px;overflow:auto;padding:8px 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px;min-width:0;width:100%}
input[type=color]{padding:2px;height:34px}input[type=checkbox]{width:auto}
.full{grid-column:1/-1}.mu{color:var(--mu)}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ly{display:flex;gap:6px;align-items:center;padding:6px;border:1px solid var(--ln);border-radius:8px;margin-bottom:6px}
.ly b{flex:1;font-weight:600}.ly.on{border-color:var(--ac)}
#dlg{position:fixed;inset:0;background:#000b;display:none;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#dlg.on{display:flex}
.card{margin:auto;width:min(880px,100%);height:min(94%,100%);background:var(--pn);display:flex;flex-direction:column;border-radius:12px;padding:12px;gap:8px}
#chips{overflow-x:auto;flex-wrap:nowrap}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
#imgbox{align-items:center;justify-content:center;background:var(--bg);border-radius:8px}
#imgp{max-width:100%;max-height:100%;object-fit:contain}
#code{flex:1;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#0f1720;color:#d6e2ee;white-space:pre;tab-size:2;border-color:#0f1720}
#pv{flex:1;border:1px solid var(--ln);background:#fff;min-height:0;width:100%}
#warn{font-size:12px;color:var(--mu);max-height:84px;overflow:auto;white-space:pre-wrap}
.err{color:#d6453b}.ok{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:99;display:none}
html{height:100dvh}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
#area{flex:1;min-height:0;position:relative;display:flex}
#wrap{position:absolute;inset:0;display:flex;flex:none;align-items:normal;justify-content:normal;overflow:auto;padding:64px 24px 28px;touch-action:none;scrollbar-width:none}
#fit{margin:auto;flex:none}
#zc{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:5}
#zc button{min-width:40px;opacity:.92}
#qb{display:flex;gap:6px;padding:6px 10px;overflow-x:auto;background:var(--pn);border-top:1px solid var(--ln)}
#qb.off{visibility:hidden}
#sheet.min{display:none}
@media(max-width:700px),(pointer:coarse){button{min-height:42px;padding:8px 12px}input,select,textarea{font-size:16px}#code{font-size:13px}#sheet{height:30dvh}.card{width:100%;height:100%;border-radius:0;padding:10px}header{padding:6px 8px}.g{grid-template-columns:repeat(2,1fr)}}
#tools{scrollbar-width:none}#tools::-webkit-scrollbar{display:none}#tools button{flex:none}#tools.nosel .sa{display:none}
.sep{width:1px;background:var(--ln);flex:none;margin:4px 2px}
h1{font-size:15px;white-space:nowrap}#zc button{min-width:36px;min-height:34px;padding:4px 8px}
</style></head><body>
<header><h1>Editor Desain</h1><button id="size">Ukuran</button><button id="undo">Urungkan</button><button class="pri" id="dl">Unduh</button></header>
<div id="area"><div id="wrap"><div id="fit"><div id="stage"></div></div></div><div id="zc"><button data-z="-">−</button><button data-z="0">Pas</button><button data-z="+">+</button></div></div>

<div id="tools" class="nosel"><button data-add="text">+ Teks</button><button data-add="rect">+ Kotak</button><button data-add="ellipse">+ Lingkaran</button><button id="addimg">+ Gambar</button><span class="sep sa"></span><button class="sa" data-a="dup">Duplikat</button><button class="sa" data-a="del">Hapus</button><button class="sa" data-a="up">Naik</button><button class="sa" data-a="dn">Turun</button><button class="sa" data-a="lock">Kunci</button><button class="sa pri" data-a="code">Kode</button><span class="sep"></span><button data-tab="prop" class="on">Properti</button><button data-tab="layer">Layer</button><button id="pan">Panel ▾</button></div>
<input type="file" id="file" accept="image/*" hidden><input type="file" id="bgfile" accept="image/*" hidden>
<div id="sheet"><div id="pp"></div></div>
<div id="dlg"><div class="card">
<div class="row"><b id="dt" style="flex:1">Unduh</b><button id="back">Kembali ke Editor</button></div>
<div class="row" id="chips"></div>
<div id="imgbox" class="mid"><img id="imgp" alt="Pratinjau desain"></div>
<div id="codebox" class="mid"><div id="warn"></div><textarea id="code" spellcheck="false"></textarea><iframe id="pv" hidden title="Pratinjau"></iframe></div>
<div class="row" id="acts"></div>
</div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRESETS=[['Instagram Post 1080×1080',1080,1080],['Instagram Potret 1080×1350',1080,1350],['Story / Reels 1080×1920',1080,1920],['Thumbnail YouTube 1280×720',1280,720],['Presentasi 1920×1080',1920,1080],['A4 (96 dpi) 794×1123',794,1123],['Sampul Facebook 820×312',820,312],['Kartu nama 1050×600',1050,600]];
const presetOpts=()=>{const o=D.document,i=PRESETS.findIndex(p=>p[1]===o.width&&p[2]===o.height);return PRESETS.map((p,j)=>`<option value="${j}"${j===i?' selected':''}>${p[0]}</option>`).join('')+`<option value="-1"${i<0?' selected':''}>Kustom</option>`};
const FONTS=['Arial','Georgia','Impact','Verdana','Trebuchet MS','Courier New','Times New Roman'];
let D,sel=null,hist=[],K=1,Z=1,lastTap={},pts=new Map(),pz=null,panning=null,tab='prop',cnt={},drag=null,F='png',INL=false,PV=false,Wn=[],FFg=[];
const byId=id=>D.elements.find(e=>e.id===id);
const warn=s=>{if(!Wn.includes(s))Wn.push(s)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1800)}
function newId(t){let id;do{cnt[t]=(cnt[t]||0)+1;id=`element_${t}_${String(cnt[t]).padStart(3,'0')}`}while(D&&byId(id));return id}
function mk(t,o={}){const L={text:'Teks',rect:'Kotak',ellipse:'Lingkaran',image:'Gambar'};
 const e={id:newId(t),type:t,name:L[t]+' '+cnt[t],x:100,y:100,width:300,height:200,rotation:0,pivot:{x:.5,y:.5},opacity:1,visible:true,locked:false,zIndex:0};
 if(t==='rect'||t==='ellipse')e.style={fill:'#0b7d6e',stroke:'#000000',strokeWidth:0,radius:0};
 if(t==='text')e.text={content:'Ketuk dua kali untuk mengubah',fontFamily:'Arial',fontSize:56,fontWeight:700,color:'#17202a',textAlign:'left'};
 return Object.assign(e,o)}
function syncCnt(){cnt={};D.elements.forEach(e=>{const m=/^element_([a-z]+)_(\d+)$/.exec(e.id);if(m)cnt[m[1]]=Math.max(cnt[m[1]]||0,+m[2])});D.assets.forEach(a=>{const m=/(\d+)$/.exec(a.id);if(m)cnt.asset=Math.max(cnt.asset||0,+m[1])})}
function seed(){D={schema:'universal-design',schemaVersion:1,document:{id:'doc_001',name:'Poster Saya',width:1080,height:1350,unit:'px',background:{type:'color',value:'#fff4e0'}},elements:[],assets:[],metadata:{generator:'Universal Design Editor'}};
 D.elements.push(mk('rect',{name:'Panel',x:80,y:280,width:920,height:800,style:{fill:'#ffffff',stroke:'#ff8800',strokeWidth:6,radius:36}}),
 mk('text',{name:'Judul',x:100,y:120,width:880,height:100,text:{content:'DESAIN SAYA',fontFamily:'Arial',fontSize:56,fontWeight:700,color:'#111111',textAlign:'center'}}),
 mk('ellipse',{name:'Lingkaran',x:340,y:420,width:400,height:400,rotation:0,style:{fill:'#ff8800',stroke:'#000000',strokeWidth:0,radius:0}}),
 mk('text',{name:'Subjudul',x:140,y:900,width:800,height:120,rotation:-4,text:{content:'Seret, putar, lalu unduh sebagai kode',fontFamily:'Georgia',fontSize:44,fontWeight:400,color:'#17202a',textAlign:'center'}}))}
function reindex(){D.elements.forEach((e,i)=>e.zIndex=i)}
function commit(){reindex();hist.push(JSON.stringify(D));if(hist.length>60)hist.shift()}

/* ===== Renderer bersama (juga dipakai apa adanya di kode Canvas) ===== */
function drawDoc(c,d,imgs){
 const o=d.document;c.clearRect(0,0,o.width,o.height);
 c.fillStyle=o.background.value;c.fillRect(0,0,o.width,o.height);
 const bg=o.background;
 if(bg.type==='image'&&imgs&&imgs[bg.assetId]){
  const im=imgs[bg.assetId];let w=o.width,h=o.height,x=0,y=0;
  if(bg.fit!=='stretch'){const s=(bg.fit==='contain'?Math.min:Math.max)(o.width/im.width,o.height/im.height);w=im.width*s;h=im.height*s;x=(o.width-w)/2;y=(o.height-h)/2}
  c.drawImage(im,x,y,w,h)}
 d.elements.slice().sort((a,b)=>a.zIndex-b.zIndex).forEach(e=>{
  if(!e.visible)return;
  c.save();c.globalAlpha=e.opacity;
  c.translate(e.x+e.width*e.pivot.x,e.y+e.height*e.pivot.y);
  c.rotate(e.rotation*Math.PI/180);
  c.translate(-e.width*e.pivot.x,-e.height*e.pivot.y);
  const s=e.style||{},k=s.strokeWidth||0;
  if(e.type==='rect'||e.type==='ellipse'){
   c.beginPath();
   if(e.type==='ellipse')c.ellipse(e.width/2,e.height/2,Math.max(0,(e.width-k)/2),Math.max(0,(e.height-k)/2),0,0,Math.PI*2);
   else{const r=Math.max(0,Math.min(s.radius||0,e.width/2,e.height/2)-k/2);
    if(c.roundRect)c.roundRect(k/2,k/2,e.width-k,e.height-k,r);else c.rect(k/2,k/2,e.width-k,e.height-k)}
   if(s.fill){c.fillStyle=s.fill;c.fill()}
   if(k>0){c.lineWidth=k;c.strokeStyle=s.stroke;c.stroke()}
  }else if(e.type==='image'){
   const im=imgs&&imgs[e.assetId];
   if(im)c.drawImage(im,0,0,e.width,e.height);
   else{c.fillStyle='#cccccc';c.fillRect(0,0,e.width,e.height)}
  }else if(e.type==='text'){
   const t=e.text;c.font=t.fontWeight+' '+t.fontSize+'px "'+t.fontFamily+'", sans-serif';
   c.fillStyle=t.color;c.textBaseline='middle';c.textAlign=t.textAlign;
   const X=t.textAlign==='center'?e.width/2:t.textAlign==='right'?e.width:0,lines=[];
   t.content.split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{const q=l?l+' '+w:w;if(l&&c.measureText(q).width>e.width){lines.push(l);l=w}else l=q});lines.push(l)});
   lines.forEach((l,i)=>c.fillText(l,X,(i+.5)*t.fontSize*1.2));
  }
  c.restore()});
}
const loadImgs=d=>{const m={};return Promise.all(d.assets.map(a=>new Promise(r=>{const i=new Image();i.onload=()=>{m[a.id]=i;r()};i.onerror=r;i.src=a.src}))).then(()=>m)};
async function rcv(){const o=D.document,c=document.createElement('canvas');c.width=o.width;c.height=o.height;drawDoc(c.getContext('2d'),D,await loadImgs(D));return c}

/* ===== CSS elemen (dipakai editor dan ekspor HTML) ===== */
function bgCss(d){const b=d.document.background,a=b.type==='image'&&d.assets.find(x=>x.id===b.assetId);return b.value+(a?` url("${a.src}") center/${b.fit==='stretch'?'100% 100%':b.fit==='contain'?'contain':'cover'} no-repeat`:'')}
function css(e){const s=e.style||{},t=e.text;
 let c=`position:absolute;box-sizing:border-box;left:${e.x}px;top:${e.y}px;width:${e.width}px;height:${e.height}px;transform:rotate(${e.rotation}deg);transform-origin:${e.pivot.x*100}% ${e.pivot.y*100}%;opacity:${e.opacity};z-index:${e.zIndex};`;
 if(!e.visible)c+='display:none;';
 if(e.type==='rect'||e.type==='ellipse'){c+=`background:${s.fill||'transparent'};`;if(s.strokeWidth>0)c+=`border:${s.strokeWidth}px solid ${s.stroke};`;c+=`border-radius:${e.type==='ellipse'?'50%':(s.radius||0)+'px'};`}
 if(e.type==='text')c+=`font:${t.fontWeight} ${t.fontSize}px/1.2 '${t.fontFamily}',sans-serif;color:${t.color};text-align:${t.textAlign};white-space:pre-wrap;`;
 return c}
function inner(e,d){if(e.type==='text')return esc(e.text.content);
 if(e.type==='image'){const a=d.assets.find(x=>x.id===e.assetId);return `<img src="${a?a.src:''}" alt="" draggable="false" style="width:100%;height:100%;display:block;pointer-events:none">`}return ''}

/* ===== Editor ===== */
function fit(){const w=$('#wrap'),o=D.document;K=Math.max(.02,Math.min((w.clientWidth-48)/o.width,(w.clientHeight-92)/o.height)*Z);
 $('#fit').style.cssText=`width:${o.width*K}px;height:${o.height*K}px`;
 const s=$('#stage');s.style.width=o.width+'px';s.style.height=o.height+'px';s.style.background=bgCss(D);
 s.style.transform=`scale(${K})`;s.style.setProperty('--k',K);s.style.setProperty('--hs',(40/K)+'px')}
function render(){fit();const st=$('#stage');st.innerHTML='';
 D.elements.forEach(e=>{const d=document.createElement('div');d.dataset.id=e.id;d.style.cssText=css(e)+(e.locked?'':'cursor:move;');d.innerHTML=inner(e,D);
  if(e.id===sel){d.classList.add('sel');if(!e.locked)d.insertAdjacentHTML('beforeend','<i class="hr" data-h="r"></i><i class="hs" data-h="s"></i>')}st.append(d)});qbUpd()}
function select(id){if(sel===id)return;sel=id;render();panel()}
function tgt(p){return p.startsWith('doc.')?[D.document,p.slice(4)]:[byId(sel),p]}
function get(p){const[o,k]=tgt(p);return k==='bg'?o.background.value:k==='fit'?o.background.fit:k.split('.').reduce((a,b)=>a&&a[b],o)}
function set(p,v){const[o,k]=tgt(p);if(k==='bg'){o.background.value=v;return}if(k==='fit'){o.background.fit=v;return}const ks=k.split('.'),l=ks.pop();ks.reduce((a,b)=>a[b],o)[l]=v}
const Fi=(l,k,t='number',x='')=>`<label>${l}<input data-k="${k}" type="${t}" ${x}></label>`;
const Fs=(l,k,o,n)=>`<label>${l}<select data-k="${k}" ${n?'data-n=1':''}>${o.map(v=>`<option value="${v[0]}">${v[1]}</option>`).join('')}</select></label>`;
function panel(){const P=$('#pp'),e=sel&&byId(sel);
 if(tab==='layer'){P.innerHTML=D.elements.slice().reverse().map(x=>`<div class="ly${x.id===sel?' on':''}" data-id="${x.id}"><b>${esc(x.name)}</b><button data-a="up">Naik</button><button data-a="dn">Turun</button><button data-a="vis">${x.visible?'Tampil':'Sembunyi'}</button><button data-a="lock">${x.locked?'Terkunci':'Buka'}</button></div>`).join('')||'<p class="mu">Belum ada objek.</p>';return}
 if(!e){P.innerHTML='<p class="mu">Ketuk objek untuk mengedit. Seret untuk memindah, tarik titik pojok untuk mengubah ukuran, titik di atas untuk memutar.</p><div class="g"><label class="full">Ukuran kanvas<select data-p="1">'+presetOpts()+'</select></label>'+Fi('Lebar kanvas','doc.width','number','min=50')+Fi('Tinggi kanvas','doc.height','number','min=50')+Fi('Latar','doc.bg','color')+'<div class="full row"><button data-sw="1">Tukar lebar dan tinggi</button><button data-bgi="add">'+(D.document.background.type==='image'?'Ganti gambar latar</button><button data-bgi="del">Hapus gambar latar':'Gambar latar')+'</button></div>'+(D.document.background.type==='image'?Fs('Penyesuaian','doc.fit',[['cover','Penuhi (dipotong)'],['contain','Muat semua'],['stretch','Tarik']]):'')+'</div>';sync();return}
 let h='<div class="g">'+Fi('Nama','name','text')+Fi('X','x')+Fi('Y','y')+Fi('Lebar','width')+Fi('Tinggi','height')+Fi('Rotasi °','rotation')+Fi('Opacity','opacity','range','min=0 max=1 step=.05')+'</div>';
 if(e.type==='text')h+='<div class="g"><label class="full">Isi teks<textarea data-k="text.content" rows="2"></textarea></label>'+Fs('Font','text.fontFamily',FONTS.map(f=>[f,f]))+Fi('Ukuran','text.fontSize')+Fs('Berat','text.fontWeight',[[400,'Normal'],[700,'Tebal']],1)+Fs('Rata','text.textAlign',[['left','Kiri'],['center','Tengah'],['right','Kanan']])+Fi('Warna','text.color','color')+'</div>';
 else if(e.type!=='image')h+='<div class="g">'+Fi('Isi','style.fill','color')+Fi('Garis','style.stroke','color')+Fi('Tebal garis','style.strokeWidth')+(e.type==='rect'?Fi('Sudut','style.radius'):'')+'</div>';
 h+=`<div class="row"><button data-a="up">Naik</button><button data-a="dn">Turun</button><button data-a="dup">Duplikat</button><button data-a="lock">${e.locked?'Buka kunci':'Kunci'}</button><button data-a="del">Hapus</button><button class="pri" data-a="code">Lihat Kode Elemen</button></div>`;
 P.innerHTML=h;sync()}
function sync(){$$('#pp [data-k]').forEach(i=>{if(i===document.activeElement)return;const v=get(i.dataset.k);if(v!==undefined)i.value=v})}
$('#pp').addEventListener('input',ev=>{const t=ev.target,k=t.dataset.k;if(!k)return;let v=t.value;
 if(t.type==='number'||t.type==='range'||t.dataset.n){v=parseFloat(v);if(isNaN(v))return}
 if(['width','height','doc.width','doc.height'].includes(k)&&v<1)return;set(k,v);render()});
$('#pp').addEventListener('change',ev=>{const t=ev.target;if(t.dataset.p){const p=PRESETS[+t.value];if(p){D.document.width=p[1];D.document.height=p[2];commit();render();panel()}return}commit()});
$('#pp').addEventListener('click',ev=>{if(ev.target.dataset.sw){const o=D.document;[o.width,o.height]=[o.height,o.width];commit();render();panel()}});
$('#pp').addEventListener('click',ev=>{const b=ev.target.dataset.bgi;if(b==='add')$('#bgfile').click();if(b==='del'){const a=D.document.background;D.document.background={type:'color',value:a.value};D.assets=D.assets.filter(x=>x.id!==a.assetId||D.elements.some(e=>e.assetId===x.id));commit();render();panel()}});
$('#bgfile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const i=new Image();
 i.onload=()=>{const m=Math.min(1,1600/Math.max(i.width,i.height)),w=Math.round(i.width*m),h=Math.round(i.height*m),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);
  const png=f.type==='image/png',mime=png?'image/png':'image/jpeg',id='asset_'+((cnt.asset=(cnt.asset||0)+1)),old=D.document.background;
